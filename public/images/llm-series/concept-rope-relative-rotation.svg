<title id="title">RoPE：共同平移，夹角不变</title><desc id="desc">q与k原始向量相同，频率pi/6。位置1,3的旋转角为30和90度；共同平移10后位置11,13，角为330和390度。夹角均60度，点积均cos60=1/2。390度与30度同方向。</desc>
