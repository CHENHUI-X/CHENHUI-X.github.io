<title id="title">KV Cache：新 token 何时进入缓存</title><desc id="desc">空缓存 prefill 输入 x1 x2 x3，计算三个 query 和三组 K/V，采样 x4 但 x4 尚未前向。下一轮 decode 处理 x4，计算 Q4 和 K4/V4，缓存长度变为4，Q4 读取四组K/V。S计当前query数，T计可用key数。</desc>
