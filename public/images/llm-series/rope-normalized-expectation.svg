<svg xmlns="http://www.w3.org/2000/svg" width="720" height="810" viewBox="0 0 720 810" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">RoPE：归一化原始点积期望</title>
<desc id="desc">在有限二阶矩与交叉二阶矩 E[q_j k_l]=δ_jl 的假设下，κ(Δ)=E[s(Δ)]/d=(2/d)∑_{i=0}^{d/2−1} cos(Δ·10000^(−2i/d))。基数 b=10000，完整旋转维度 d 为16、64、256，整数相对距离Δ从0到100。各曲线κ(0)=1，均有振荡和局部回升。这里的归一化是除以d，不是softmax；曲线不是注意力权重，也不保证单调下降。</desc>
<metadata>Original deterministic scientific plot calculated from article sections 6.1–6.2. All 101 integer distances per dimension are joined by straight segments; no smoothing or fitted envelope.</metadata>
