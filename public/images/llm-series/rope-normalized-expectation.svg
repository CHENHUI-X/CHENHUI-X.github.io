<text x="36" y="129" font-size="28" fill="#586779" text-anchor="start" font-weight="400">假设：有限二阶矩，E[qⱼ kℓ] = δⱼℓ</text>
<text x="36" y="173" font-size="28" fill="#586779" text-anchor="start" font-weight="400">基数 b = 10000；θᵢ = b^(−2i/d)</text>
